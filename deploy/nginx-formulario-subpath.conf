location = /sigma-apps/formulario-embarcadores {
    return 301 /sigma-apps/formulario-embarcadores/;
}

location = /sigma-apps/formulario-embarcadores/ {
    return 302 /sigma-apps/formulario-embarcadores/html/index.html;
}

location ^~ /sigma-apps/formulario-embarcadores/ {
    rewrite ^/sigma-apps/formulario-embarcadores/(.*)$ /$1 break;
    proxy_pass http://127.0.0.1:8099;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Prefix /sigma-apps/formulario-embarcadores;
    proxy_read_timeout 120s;
}
