location = /sigma-apps/formulario-embarcadores {
    proxy_pass http://127.0.0.1:8099/html/index.html;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Accept-Encoding "";
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Prefix /sigma-apps/formulario-embarcadores;
    sub_filter_once on;
    sub_filter '<head>' '<head><base href="/sigma-apps/formulario-embarcadores/html/">';
}

location = /sigma-apps/formulario-embarcadores/ {
    return 301 https://$host/sigma-apps/formulario-embarcadores;
}

location = /sigma-apps/formulario-embarcadores/html/index.html {
    return 301 https://$host/sigma-apps/formulario-embarcadores;
}

location ^~ /sigma-apps/formulario-embarcadores/ {
    rewrite ^/sigma-apps/formulario-embarcadores/(.*)$ /$1 break;
    proxy_pass http://127.0.0.1:8099;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Prefix /sigma-apps/formulario-embarcadores;
    proxy_read_timeout 120s;
}
